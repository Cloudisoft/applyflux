<!doctype html><html><head><title>My Experience</title></head><body>
<div data-automation-id="applyFlowPage">
 <h2>My Experience</h2>
 <div data-automation-id="workExperienceSection">
  <div data-automation-id="workExperience-1">
   <h4>Work Experience 1</h4>
   <label for="we1-title">Job Title*</label><input id="we1-title" type="text" aria-required="true">
   <label for="we1-company">Company*</label><input id="we1-company" type="text" aria-required="true">
   <label for="we1-current">I currently work here</label><input id="we1-current" type="checkbox">
   <label for="we1-from">From*</label><input id="we1-from" type="text" placeholder="MM/YYYY" aria-required="true">
   <label for="we1-to">To</label><input id="we1-to" type="text" placeholder="MM/YYYY">
  </div>
  <div data-automation-id="workExperience-2">
   <h4>Work Experience 2</h4>
   <label for="we2-title">Job Title*</label><input id="we2-title" type="text" aria-required="true">
   <label for="we2-company">Company*</label><input id="we2-company" type="text" aria-required="true">
   <label for="we2-from">From*</label><input id="we2-from" type="text" placeholder="MM/YYYY" aria-required="true">
   <label for="we2-to">To</label><input id="we2-to" type="text" placeholder="MM/YYYY">
  </div>
  <button data-automation-id="Add" aria-label="Add Work Experience">Add Another</button>
 </div>
 <div data-automation-id="educationSection">
  <div data-automation-id="education-1">
   <h4>Education 1</h4>
   <label for="ed1-school">School or University*</label><input id="ed1-school" type="text" aria-required="true">
   <label for="ed1-degree">Degree</label><select id="ed1-degree"><option value="">Select One</option><option value="ba">Bachelor of Arts</option><option value="bsc">Bachelor of Science</option><option value="msc">Master of Science</option></select>
  </div>
 </div>
 <button data-automation-id="bottom-navigation-next-button">Save and Continue</button>
</div></body></html>
