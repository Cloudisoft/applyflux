<!doctype html><html><head><title>GTM Systems Analyst @ Ashby</title></head><body>
<!-- Structure copied from a live jobs.ashbyhq.com application page (Oct 2026): no <form>, ashby-* classes, Yes/No buttons. -->
<div id="root"><div class="ashby-job-posting-right-pane"><div id="form">
  <div class="ashby-application-form-autofill-uploader"><input type="file" aria-label="Autofill from resume"></div>
  <div class="ashby-application-form-container">
    <div class="ashby-application-form-section-container">
      <div class="ashby-application-form-field-entry"><label for="_systemfield_name">Name*</label><div><input type="text" id="_systemfield_name" name="_systemfield_name" required></div></div>
      <div class="ashby-application-form-field-entry"><label for="_systemfield_email">Email*</label><div><input type="email" id="_systemfield_email" name="_systemfield_email" required></div></div>
      <div class="ashby-application-form-field-entry"><label for="_systemfield_resume">Resume*</label><div class="ashby-application-form-input-file"><input type="file" id="_systemfield_resume" accept=".pdf,.docx" required><button type="button">Upload File</button></div></div>
      <div class="ashby-application-form-field-entry"><label for="li">LinkedIn Profile</label><div><input type="text" id="li" name="b53ebd09-linkedin"></div></div>
      <div class="ashby-application-form-field-entry"><label>Will you now or in the future require sponsorship for employment visa status?*</label>
        <div><button type="button" class="_option_x">Yes</button><button type="button" class="_option_x">No</button><input type="checkbox" style="display:none" name="sponsor-hidden"></div></div>
      <div class="ashby-application-form-field-entry"><label for="why">In 2–4 sentences, describe one workflow you built.*</label><textarea id="why" name="why" required></textarea></div>
    </div>
    <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
  </div>
</div></div></div>
</body></html>
